<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Fallback Redirect: If JS is disabled, browser redirects after 1 second -->
    <noscript>
        <meta http-equiv="refresh" content="1; url=https://melbet-10789.today/en/registration?tag=d_5419365m_66335c_&type=phone&bonus=SPORT&currency=BDT">
    </noscript>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #09f;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting you to the platform...</p>
        <p>If you are not redirected, <a id="redirect-link" href="https://melbet-10789.today/en/registration?tag=d_5419365m_66335c_&type=phone&bonus=SPORT&currency=BDT">click here</a>.</p>
    </div>

    <script>
        (function() {
            // Base target URL (excluding query params)
            const baseTarget = "https://melbet-10789.today/en/registration";
            
            // Default params from your affiliate link
            const defaultParams = {
                tag: "d_5419365m_66335c_",
                type: "phone",
                bonus: "SPORT",
                currency: "BDT"
            };

            // Parse incoming query parameters from the browser URL
            const incomingParams = new URLSearchParams(window.location.search);
            const targetParams = new URLSearchParams();

            // 1. Load default affiliate parameters
            for (const [key, value] of Object.entries(defaultParams)) {
                targetParams.set(key, value);
            }

            // 2. Override/Append any incoming parameters (e.g. UTM codes, custom tags)
            for (const [key, value] of incomingParams.entries()) {
                targetParams.set(key, value);
            }

            // Construct final URL
            const finalDestination = `${baseTarget}?${targetParams.toString()}`;

            // Update fallback links in case of redirect delay
            document.getElementById('redirect-link').href = finalDestination;

            // Execute the client-side redirect immediately
            window.location.replace(finalDestination);
        })();
    </script>
</body>
</html>
